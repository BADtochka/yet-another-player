name: Desktop builds

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.1.0). Run from that tag to publish; leave empty for build artifacts only.'
        required: false
        type: string
      linux_only:
        description: 'Build only Linux (no release upload)'
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-info:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          LINUX_ONLY: ${{ inputs.linux_only }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch) tag="$MANUAL_TAG" ;;
            *) tag="" ;;
          esac
          if [[ -z "$tag" ]]; then
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$GITHUB_REF" != "refs/tags/$tag" || "$LINUX_ONLY" == "true" ]]; then
            echo "::error::Select the matching vX.Y.Z tag and enable both platforms to publish a release."
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$tag" "${tag#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows NSIS installer
    needs: release-info
    if: ${{ !inputs.linux_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: xwin-msvc

      - name: Cache cargo-xwin
        id: cache-cargo-xwin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-1

      - name: Install cargo-xwin
        if: steps.cache-cargo-xwin.outputs.cache-hit != 'true'
        run: cargo install cargo-xwin --locked

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm nsis

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        if: needs.release-info.outputs.tag != ''
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
        run: ./scripts/set-version.sh "$VERSION"

      - name: Build Windows NSIS installer
        if: needs.release-info.outputs.tag == ''
        run: bun run build:windows

      - name: Build and sign Windows release installer
        if: needs.release-info.outputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:windows:release

      - name: Upload NSIS bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-bundle
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64 packages
    needs: release-info
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-jammy-x64

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        if: needs.release-info.outputs.tag != ''
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
        run: ./scripts/set-version.sh "$VERSION"

      - name: Build Linux packages
        if: needs.release-info.outputs.tag == ''
        run: bun run build:linux

      - name: Build and sign Linux release packages
        if: needs.release-info.outputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:linux:release

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-deb
          path: src-tauri/target/release/bundle/deb/*.deb*
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error

  publish-release:
    name: Create desktop release draft
    needs: [release-info, build-windows, build-linux]
    if: needs.release-info.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NSIS bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-bundle
          path: release-assets

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux-x86_64-*
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest
        env:
          TAG: ${{ needs.release-info.outputs.tag }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: node ./scripts/generate-latest-json.mjs release-assets "$VERSION" "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          name: yet-another-player ${{ needs.release-info.outputs.tag }}
          draft: true
          prerelease: false
          body: |
            Download `yet-another-player_*_x64-setup.exe` for Windows.

            On Linux x86_64, use the `.deb` package on Debian/Ubuntu or download the `.AppImage` and make it executable.

            Installed apps check GitHub Releases for updates automatically.
          files: release-assets/*
          fail_on_unmatched_files: true

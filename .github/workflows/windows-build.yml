name: Windows build

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.0.3). Required for manual release uploads.'
        required: false
        type: string

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: xwin-msvc

      - name: Install cargo-xwin
        uses: taiki-e/cache-cargo-install-action@v1
        with:
          tool: cargo-xwin

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm nsis

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        if: steps.release.outputs.tag != ''
        run: |
          VERSION="${{ steps.release.outputs.tag }}"
          VERSION="${VERSION#v}"
          chmod +x ./scripts/set-version.sh
          ./scripts/set-version.sh "$VERSION"

      - name: Build Windows NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "${{ steps.release.outputs.tag }}" ]]; then
            bun run build:windows:release
          else
            bun run build:windows
          fi

      - name: Upload NSIS bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-bundle
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          if-no-files-found: error

  publish-release:
    name: Publish Windows release
    needs: build-windows
    if: needs.build-windows.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NSIS bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-bundle
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.release_tag }}
          name: yet-another-player ${{ needs.build-windows.outputs.release_tag }}
          draft: true
          prerelease: false
          body: |
            Download `yet-another-player_*_x64-setup.exe` for Windows.

            Installed apps check GitHub Releases for updates automatically.
          files: release-assets/*

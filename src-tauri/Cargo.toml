[package]
name = "yet-another-player"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yet_another_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
audio-probe = []

[[example]]
name = "audio_probe"
required-features = ["audio-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dom_query = "0.27"
tauri-plugin-process = "2"
tauri-plugin-zustand = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "macos-system-configuration", "blocking", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
rodio = { version = "0.23", default-features = false, features = [
  "playback", "mp3", "mp4", "vorbis", "symphonia-mkv", "flac", "wav"
] }

symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "mkv"] }
opus-decoder = "0.1.1"
rtrb = "0.3"
rand = "0.9"
rusqlite = { version = "0.42", features = ["bundled"] }
icu_collator = "=2.2.1"
icu_locale_core = "2.2"
lofty = "0.25"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
walkdir = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
playwire = "2.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "block2", "objc2-core-graphics", "objc2-quartz-core", "NSApplication", "NSColor", "NSControl",
  "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSScreen",
  "NSText", "NSTextField", "NSView", "NSWindow"
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = [
  "Media", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT",
  "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"
] }
